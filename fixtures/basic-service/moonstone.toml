[package]
name = "meteorite-basic-service"
version = "0.1.0"
kind = "bin"
description = "Meteorite fixture service"

[runtime]
name = "lua"
version = "5.4"
abi = "5.4"

[dependencies.runtime]
"moonstone/meteorite" = "path:../.."

[scripts]
"graph" = "lua src/meteorite/cli.lua graph src/main.lua .meteorite/graph/current release-static"
"dev" = "luajit ../../src/meteorite/cli.lua graph src/main.lua .meteorite/graph/current dev && zig build install-server -- dist/server && ./dist/server"
"build" = "zig build install-server"
