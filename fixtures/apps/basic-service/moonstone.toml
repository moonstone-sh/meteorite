[package]
name = "meteorite-basic-service"
version = "0.1.0"
kind = "script"
description = "Meteorite basic service example"

[interpreter]
name = "lua"
version = "5.4"
abi = "5.4"

[scripts]
"graph" = "moon exec meteorite graph src/main.lua .meteorite/graph/current release-static std_http"

[[dependencies]]
name = "moonstone/meteorite"
constraint = "path:../../.."
role = "tool"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.2.41"
role = "tool"
