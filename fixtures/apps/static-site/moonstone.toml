manifest_version = 2

[package]
name = "meteorite-static-site"
version = "0.1.0"
kind = "script"
description = "Meteorite static site release example"

[interpreter]
name = "lua"
version = "5.4"
abi = "5.4"

[[dependencies]]
name = "moonstone/meteorite"
constraint = "path:../../.."
role = "tool"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.0"
role = "tool"
