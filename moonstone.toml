manifest_version = 2

[package]
name = "moonstone/meteorite"
version = "0.2.3"
kind = "bin"
description = "Moonstone-zig service compiler prototype"

[interpreter]
name = "lua"
version = "5.4"
abi = "5.4"

[origin]
kind = "git"
url = "https://github.com/moonstone-sh/meteorite"

[scripts]
test-hygiene = "bash tests/repository-hygiene.sh"
test-release-gate = "bash tests/release-gate.sh"
test-basic-service-http = "bash fixtures/tests/basic-service-http.sh"
bench-lua-bridge = "bash bench/run.sh --mode=lua-bridge \"$@\""
bench-work = "bash bench/run.sh --mode=work \"$@\""
build = "zig build install-server -Dgraph-input=fixtures/apps/showcase-service/src/main.lua -Dgraph-output=.meteorite/graph/current"
test-release-smoke = "bash fixtures/tests/release-smoke.sh"
test-ipc-backends = "bash fixtures/tests/ipc-backends.sh"
build-examples = "moon exec ballad -- play examples_partiture.lua"
bench-public = "bash bench/run.sh --mode=public \"$@\""
dev = "sh scripts/watch.sh --mode hybrid_dev --backend fast_http --hybrid-profile optimized --router-dispatch param_matchers"
run = "zig build -Dgraph-input=fixtures/apps/showcase-service/src/main.lua -Dgraph-output=.meteorite/graph/current run"
build-dev = "moon exec ballad -- play Dev_partiture.lua -- --mode hybrid_dev --backend fast_http --hybrid-profile optimized --router-dispatch param_matchers"
test-all = "bash tests/run-all.sh && bash tests/build-api-native.sh && bash fixtures/tests/ipc-backends.sh"
test-fixture = "root=\"$PWD\"; cd fixtures/apps/basic-service && LUA_PATH=\"$root/src/ballad_plugin/?.lua;$root/src/ballad_plugin/?/init.lua;$root/src/?.lua;$root/src/?/init.lua;$root/../ballad/.moonstone/env/share/lua/5.1/?.lua;$root/../ballad/.moonstone/env/share/lua/5.1/?/init.lua;$root/../ballad/src/?.lua;$root/../ballad/src/?/init.lua;;\" luajit \"$root/../ballad/src/main.lua\" play partiture.lua"
test-web-standards = "bash fixtures/tests/web-standards.sh"
test-registry-export = "bash tests/registry-export.sh"
test-basic-service-contracts = "bash fixtures/tests/basic-service-contracts.sh"
test-cross-target = "bash fixtures/tests/cross-target.sh"
bench-meteorite-app = "bash bench/run.sh --mode=meteorite-app \"$@\""
test-basic-service-build = "bash fixtures/tests/basic-service-build.sh"
test-acceptance = "bash fixtures/tests/basic-service.sh"
bench-smoke = "bash bench/run.sh --mode=smoke \"$@\""
graph = "lua src/cli/main.lua graph fixtures/apps/showcase-service/src/main.lua .meteorite/graph/current release-static fast_http"
test-release-reproducibility = "bash tests/release-reproducibility.sh"
bench-lua-bridge-smoke = "bash bench/run.sh --mode=lua-bridge-smoke \"$@\""

[[orbits.member]]
name = "lapis-cqueues"
path = "bench/competitors/lapis-cqueues"

[[orbits.member]]
name = "openresty"
path = "bench/competitors/openresty"

[[orbits.member]]
name = "turbo"
path = "bench/competitors/turbo"

[[orbits.member]]
name = "lapis-openresty"
path = "bench/competitors/lapis-openresty"

[[orbits.member]]
name = "pegasus"
path = "bench/competitors/pegasus"

[[orbits.member]]
name = "basic-service"
path = "fixtures/apps/basic-service"

[[orbits.member]]
name = "bench-service"
path = "fixtures/apps/bench-service"

[[orbits.member]]
name = "hybrid-demo"
path = "fixtures/apps/hybrid-demo"

[[orbits.member]]
name = "ipc-native-service"
path = "fixtures/apps/ipc-native-service"

[[orbits.member]]
name = "ipc-unixsocket-http-service"
path = "fixtures/apps/ipc-unixsocket-http-service"

[[orbits.member]]
name = "scoped-plugins"
path = "fixtures/apps/scoped-plugins"

[[orbits.member]]
name = "showcase-service"
path = "fixtures/apps/showcase-service"

[[orbits.member]]
name = "static-site"
path = "fixtures/apps/static-site"

[[orbits.member]]
name = "web-standards"
path = "fixtures/apps/web-standards"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.5"
role = "tool"

[[dependencies]]
name = "etlua"
constraint = "^1.3.0-1"
registry = "rocks"
role = "runtime"

[[dependencies]]
name = "lua-cjson"
constraint = "^2.1.0-1"
registry = "rocks"
role = "runtime"

[[dependencies]]
name = "moonstone/clingy"
constraint = "^0.5.0"
role = "runtime"
