[package]
name = "bench-turbo"
version = "0.1.0"
kind = "bin"

[interpreter]
name = "luajit"
version = "2.1.1783773675"
abi = "5.1"

[[dependencies]]
name = "turbo"
constraint = "rocks:turbo@*"
role = "runtime"

[[dependencies]]
name = "luasocket"
constraint = "rocks:luasocket@*"
role = "runtime"

[[dependencies]]
name = "lua-cjson"
constraint = "rocks:lua-cjson@*"
role = "runtime"

[[dependencies]]
name = "etlua"
constraint = "rocks:etlua@*"
role = "runtime"

[[dependencies]]
name = "luasql-sqlite3"
constraint = "^2.8.0-1"
registry = "rocks"
role = "runtime"

[build.env]
OPENSSL_DIR = "/opt/homebrew/opt/openssl@3"
CRYPTO_DIR = "/opt/homebrew/opt/openssl@3"
CFLAGS = "-I/opt/homebrew/opt/openssl@3/include"
CPPFLAGS = "-I/opt/homebrew/opt/openssl@3/include"
LDFLAGS = "-L/opt/homebrew/opt/openssl@3/lib"
