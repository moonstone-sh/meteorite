worker_processes 1;
error_log stderr notice;
daemon off;
pid logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log off;

  server {
    listen ${{PORT}};
    lua_code_cache on;

    location / {
      default_type text/plain;
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }
  }
}
