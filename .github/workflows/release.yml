name: Publish Meteorite

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish after a publish-only failure.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Meteorite registry artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          # Formal registry identities and the lockfile projection introduced
          # after v0.3.50 are required by Meteorite's rocks: dependencies.
          ref: 94deed95d3e3ded203e806c73d6a7110059eaea6
          path: .ci/moonstone
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/ballad
          path: .ci/ballad
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum file lsof luajit zstd
      - name: Build Moonstone CLI
        working-directory: .ci/moonstone
        run: |
          zig build
          echo "$GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin" >> "$GITHUB_PATH"
      - name: Synchronize project lockfile
        run: moon sync --locked
      - name: Prepare locked Ballad integration checkout
        run: |
          ballad_version="$(awk '
            /^\[\[package\]\]$/ { in_ballad = 0; next }
            $0 == "name = \"moonstone/ballad\"" { in_ballad = 1; next }
            in_ballad && /^version = / { value = $0; sub(/^version = "/, "", value); sub(/"$/, "", value); print value; exit }
          ' moonstone.lock)"
          test -n "$ballad_version"
          git -C .ci/ballad checkout --detach "v$ballad_version"
          ln -s "$GITHUB_WORKSPACE/.ci/ballad" "$GITHUB_WORKSPACE/../ballad"
          cd .ci/ballad
          moon sync --locked
      - name: Export tagged project
        run: |
          moon exec ballad play partiture.lua
      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: test "${RELEASE_TAG#v}" = "$(sed -n 's/^version = "\(.*\)"$/\1/p' moonstone.toml | head -1)"
      - name: Upload immutable GitHub release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -eu
          asset="$(find dist/registry/meteorite -maxdepth 1 -type f -name '*.tar.zst' -print -quit)"
          test -n "$asset"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Meteorite $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" "$asset"
          echo "MOONSTONE_ARTIFACT_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/$(basename "$asset")" >> "$GITHUB_ENV"
      - name: Publish registry artifact
        env:
          MOONSTONE_TOKEN: ${{ secrets.MOONSTONE_TOKEN }}
          MOONSTONE_ARTIFACT_URL: ${{ env.MOONSTONE_ARTIFACT_URL }}
        run: |
          test -n "$MOONSTONE_TOKEN"
          dist/registry/meteorite/publish.sh
      - name: Verify published package is resolvable
        run: .ci/ballad/scripts/wait-for-publication.sh dist/registry/meteorite/package.toml
